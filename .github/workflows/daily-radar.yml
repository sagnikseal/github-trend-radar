name: 📡 Daily GitHub Trend Radar

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI
    inputs:
      limit:
        description: "Max repositories per topic"
        required: false
        default: "15"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan-and-deploy:
    name: Scan Trends & Deploy Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run trend scan and export
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m trendradar export --all --output TRENDS.md --limit ${{ github.event.inputs.limit || '15' }}

      - name: Commit updated TRENDS.md
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add TRENDS.md docs/
          git diff --staged --quiet || git commit -m "📡 Auto-update: Daily trend scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
        continue-on-error: true

  # Separate job to upload pages artifact
  upload-pages:
    name: Upload Pages Artifact
    runs-on: ubuntu-latest
    needs: scan-and-deploy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
