[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "github-trend-radar"
version = "1.0.0"
description = "Real-time GitHub demand intelligence & personal project incubator"
authors = [{ name = "github-trend-radar" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["github", "trending", "ai", "developer-tools", "cli", "portfolio"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "requests>=2.31.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
trendradar = "trendradar.cli:main"

[project.urls]
Homepage = "https://github.com/sagnikseal/github-trend-radar"
Repository = "https://github.com/sagnikseal/github-trend-radar"
Issues = "https://github.com/sagnikseal/github-trend-radar/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["trendradar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["trendradar"]
omit = ["tests/*"]
